name: C++ wrapper

# Checks that a downstream project can use the C++ wrapper through add_subdirectory and through find_package after
# `cmake --install` (cpp/scripts/ci_check.sh), on GCC, Clang and MSVC, and runs the wrapper tests once under ASan and
# UBSan. The wrapper tests themselves also run in ci.yml, with the rest of the suite.
on:
  push:
    branches: [ master ]
    paths:
      - 'cpp/**'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp.yml'

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux-gcc
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GCC 15 from the toolchain PPA, as in ci.yml; adding the PPA is retried for Launchpad's transient HTTP 500.
      - name: Install GCC 15 and Ninja
        run: |
          for attempt in 1 2 3 4 5; do
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 ninja-build

      - name: Use the wrapper from another project
        env:
          CPP_CMAKE_ARGS: -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15
        run: bash cpp/scripts/ci_check.sh

      # Only the wrapper test executable: the leaks and dangling views it could have are in the wrapper's own code.
      - name: Test the wrapper under ASan and UBSan
        run: |
          cmake -S . -B build/cpp-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build build/cpp-asan --target portopt_cpp_tests
          ctest --test-dir build/cpp-asan -R Wrapper --output-on-failure

  macos:
    name: macos-clang
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Use the wrapper from another project
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: bash cpp/scripts/ci_check.sh

  windows:
    name: windows-msvc
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the MSVC tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Use the wrapper from another project
        shell: bash
        env:
          CPP_CMAKE_ARGS: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
        run: |
          # Git's /usr/bin/link.exe would be found before MSVC's linker.
          rm -f /usr/bin/link.exe
          bash cpp/scripts/ci_check.sh
