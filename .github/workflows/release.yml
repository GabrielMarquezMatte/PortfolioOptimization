name: Release

# A v* tag publishes the wheels and the native libraries to a GitHub Release and the wheels to PyPI; a prerelease tag
# (v0.1.0-rc.1, or v0.1.0rc1: decided by the version, not by a '-') is a GitHub prerelease, and its wheels are a
# PyPI prerelease (0.1.0rc1): pip prefers a final release to it, but takes it while no final release exists. Only a
# tag publishes. A manual run on a branch builds and tests everything as the rehearsal tag
# v<version>-rc.0, so the path of a release candidate runs before the first real one, and publishes nothing.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # A tag whose version is not the one of CMakeLists.txt, python/pyproject.toml and a dated CHANGELOG section stops
  # the release before anything is built.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check the versions
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          versions() { uv run --no-project --python 3.14 --with packaging python python/scripts/release_version.py "$@"; }
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            versions check "$tag"
          else
            tag=$(versions rehearsal)
            versions check
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(versions prerelease "$tag")" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheels
    needs: version
    uses: ./.github/workflows/wheels.yml
    with:
      version: ${{ needs.version.outputs.tag }}

  # The Windows DLL is built by MinGW; MSVC users link against a .lib made from the export list of the ABI contract. The
  # .lib and the MinGW .dll.a both record libportopt.dll, so one file name serves both toolchains. The .lib is then
  # used the way an MSVC user would: cl compiles the C++ consumer of cpp/tests/package against it and runs it.
  windows-lib:
    name: Windows import library
    needs: wheels
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the Windows library
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: native

      - name: Set up the MSVC tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the import library
        shell: cmd
        working-directory: native
        run: lib /def:portopt-native-win-x64.def /name:libportopt.dll /machine:x64 /out:portopt-native-win-x64.lib

      - name: Link and run an MSVC program against it
        shell: cmd
        run: |
          mkdir msvc-consumer
          copy native\portopt-native-win-x64.dll msvc-consumer\libportopt.dll
          cl /nologo /std:c++latest /EHsc /W4 /WX /I include /I cpp\include cpp\tests\package\main.cpp native\portopt-native-win-x64.lib /Fe:msvc-consumer\main.exe /Fo:msvc-consumer\
          msvc-consumer\main.exe

      - name: Upload the import library
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64-lib
          path: native/portopt-native-win-x64.lib
          if-no-files-found: error

  # The libabigail dump of the Linux x64 library, the baseline of an ABI comparison once the ABI is frozen at 1.0.
  abi-dump:
    name: ABI dump
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The GCC 15 of the toolchain PPA; Launchpad answers 503 at times, so the whole install is retried.
      - name: Install the toolchain and libabigail
        run: |
          for attempt in 1 2 3 4 5; do
            bash scripts/install_abi_tools.sh && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 30))
          done

      - name: Dump the ABI
        run: bash scripts/abi_dump.sh portopt-abi-linux-x64.xml

      - name: Upload the dump
        uses: actions/upload-artifact@v4
        with:
          name: abi-linux-x64
          path: portopt-abi-linux-x64.xml
          if-no-files-found: error

  publish-github:
    name: GitHub Release
    needs: [ version, wheels, windows-lib, abi-dump ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: assets
          merge-multiple: true

      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: assets
          merge-multiple: true

      - name: Download the ABI dump
        uses: actions/download-artifact@v4
        with:
          name: abi-linux-x64
          path: assets

      # The .def only feeds the .lib; it is not a release asset.
      - name: Drop the export list
        run: |
          rm assets/*.def
          ls -l assets

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: assets
          format: spdx-json
          output-file: portopt.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            assets/*.whl
            assets/*.dll
            assets/*.dll.a
            assets/*.lib
            assets/*.so
            assets/*.dylib
            assets/portopt-abi-linux-x64.xml
            portopt.spdx.json

  # Trusted publishing: the PyPI project names this workflow and the environment pypi as its publisher, so no token
  # is stored.
  publish-pypi:
    name: PyPI
    needs: [ version, publish-github ]
    # Skipped as a whole outside a tag, so a dry run never enters the environment (and never waits on its rules).
    if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
