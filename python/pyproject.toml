[build-system]
requires = ["hatchling", "packaging"]
build-backend = "hatchling.build"

[project]
name = "portopt"
version = "0.1.0"
description = "Portfolio optimization over the PortOpt C API"
requires-python = ">=3.11"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest", "mypy", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/portopt"]
exclude = ["src/portopt/_lib"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
